  - id: workload_identities_premium
    name: Microsoft Entra Workload ID Premium
    plain_name: Stronger protection for apps and service accounts
    description: Conditional Access and risk-based protection for service principals and workload 
      identities.
    outcome: >
      Apply sign-in rules and risk detection to the non-human accounts that run
      your apps and automations, not only to people.
    why_it_matters: >
      Apps and service accounts move faster than people and are protected by
      fewer checks. A stolen workload identity can reach business data directly.
    if_unused: >
      Workload identity licenses may be provisioned while no Conditional Access
      policy actually gates service-principal sign-ins or risk.
    workloads: [identity]
    entitlement_kind: add_on
    service_plan_names:
