  - id: entitlement_management
    name: Microsoft Entra ID Governance
    plain_name: Managed access packages for apps, groups, and Teams
    description: Entitlement management access packages and lifecycle-governed access.
    outcome: >
      Bundle access to apps, groups, sites, and Teams into requestable packages
      with approval and expiry, so access follows the job instead of accumulating.
    why_it_matters: >
      Ad-hoc access grants accumulate until nobody knows who should have what.
      Access packages make grants reviewable and self-expiring.
    if_unused: >
      ID Governance may be entitled while access packages are never created,
      leaving group and app membership managed by hand.
    workloads: [identity]
    entitlement_kind: add_on
    service_plan_names:
